<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="DICOM vers PNG et JPEG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1e3f"/>
      <stop offset="55%" stop-color="#123a6b"/>
      <stop offset="100%" stop-color="#0e5a7a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fe0d0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ff0e6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3fe0d0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>

  <!-- grille discrète facon negatoscope -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
  </g>

  <!-- coupe axiale stylisee a gauche -->
  <g transform="translate(120,120)">
    <circle r="70" fill="none" stroke="#7fd4ff" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="70" fill="#0a2748" opacity="0.6"/>
    <ellipse cx="0" cy="8" rx="46" ry="40" fill="none" stroke="#9fe0ff" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="-18" cy="4" r="16" fill="none" stroke="#c7ecff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="18" cy="4" r="16" fill="none" stroke="#c7ecff" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="0" y1="-30" x2="0" y2="34" stroke="#c7ecff" stroke-opacity="0.4" stroke-width="2"/>
    <!-- ligne de balayage animee -->
    <rect x="-72" y="-72" width="144" height="6" fill="url(#scan)" filter="url(#glow)">
      <animate attributeName="y" values="-72;66;-72" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <circle r="70" fill="none" stroke="#5ff0e6" stroke-width="1.5" stroke-opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- fleche flux -->
  <g transform="translate(230,120)" fill="none" stroke="#5ff0e6" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="0" x2="60" y2="0" stroke-opacity="0.7">
      <animate attributeName="stroke-dasharray" values="0 60;30 60;60 0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <path d="M52,-8 L66,0 L52,8" stroke-opacity="0.9"/>
  </g>

  <!-- titre -->
  <g transform="translate(320,0)" font-family="Helvetica, Arial, sans-serif">
    <text x="0" y="96" font-size="46" font-weight="800" fill="#ffffff">DICOM → PNG / JPEG</text>
    <text x="2" y="132" font-size="19" fill="#bfe3ff">Convertisseur local pour CD &amp; disques de scanner</text>

    <!-- tags animes -->
    <g font-size="13" font-weight="700" fill="#0b1e3f">
      <g transform="translate(0,158)">
        <rect width="86" height="26" rx="13" fill="#5ff0e6">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <text x="43" y="17" text-anchor="middle">100% LOCAL</text>
      </g>
      <g transform="translate(98,158)">
        <rect width="118" height="26" rx="13" fill="#9fe0ff">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
        <text x="59" y="17" text-anchor="middle">ANONYMISE</text>
      </g>
      <g transform="translate(228,158)">
        <rect width="150" height="26" rx="13" fill="#ffd98a">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        </rect>
        <text x="75" y="17" text-anchor="middle">GLISSER-DEPOSER</text>
      </g>
    </g>
  </g>

  <!-- pile d'images qui sortent a droite -->
  <g transform="translate(792,86)">
    <g>
      <rect x="0" y="0" width="70" height="52" rx="6" fill="#eef7ff" stroke="#9fe0ff" stroke-width="2"/>
      <rect x="8" y="8" width="54" height="30" rx="3" fill="#123a6b" opacity="0.35"/>
      <circle cx="35" cy="23" r="10" fill="#5ff0e6" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0 26; 0 0; 0 0" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <rect x="-10" y="18" width="70" height="52" rx="6" fill="#dbeeff" stroke="#7fd4ff" stroke-width="2" opacity="0.85"/>
    <rect x="-20" y="36" width="70" height="52" rx="6" fill="#c9e5ff" stroke="#7fd4ff" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
