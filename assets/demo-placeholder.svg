<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Apercu de la demo glisser-deposer">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#e6edf6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea6e0"/>
      <stop offset="100%" stop-color="#5ff0e6"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="60" y="300" width="600" height="18" rx="9"/></clipPath>
  </defs>

  <rect width="720" height="400" rx="14" fill="url(#win)" stroke="#c7d5e6" stroke-width="1.5"/>

  <!-- barre de titre facon fenetre macOS -->
  <rect x="0" y="0" width="720" height="40" rx="14" fill="#dbe4f0"/>
  <rect x="0" y="26" width="720" height="14" fill="#dbe4f0"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="360" y="25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3a4a63">DICOM → images : déposez le dossier IMAGES</text>

  <!-- reglages -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#42597a">
    <text x="60" y="70">Format:</text><rect x="110" y="58" width="52" height="18" rx="4" fill="#fff" stroke="#c7d5e6"/><text x="118" y="71">PNG</text>
    <text x="180" y="70">Bits:</text><rect x="212" y="58" width="40" height="18" rx="4" fill="#fff" stroke="#c7d5e6"/><text x="222" y="71">8</text>
    <text x="270" y="70">Fenêtre:</text><rect x="322" y="58" width="80" height="18" rx="4" fill="#fff" stroke="#c7d5e6"/><text x="330" y="71">poumon</text>
  </g>

  <!-- zone de depot -->
  <rect x="60" y="92" width="600" height="180" rx="12" fill="#eef3fb" stroke="#7fb4e6" stroke-width="2.5" stroke-dasharray="10 8">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- dossier qui tombe dans la zone -->
  <g>
    <g transform="translate(330,120)">
      <path d="M0,10 h26 l6,-8 h34 a6,6 0 0 1 6,6 v52 a6,6 0 0 1 -6,6 h-66 a6,6 0 0 1 -6,-6 v-50 a6,6 0 0 1 6,-6 z" fill="#ffcf6b" stroke="#e0a83c" stroke-width="2"/>
      <text x="36" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a12">IMAGES</text>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="0 -70; 0 40; 0 40; 0 40" keyTimes="0;0.35;0.9;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.35;0.85;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <text x="360" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5a7699">
    Déposez ici le dossier IMAGES
    <animate attributeName="opacity" values="1;1;0.3;1" keyTimes="0;0.3;0.5;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- barre de progression -->
  <rect x="60" y="300" width="600" height="18" rx="9" fill="#dfe7f1"/>
  <g clip-path="url(#barclip)">
    <rect x="60" y="300" width="600" height="18" fill="url(#bar)">
      <animate attributeName="width" values="0;0;600;600" keyTimes="0;0.4;0.95;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="360" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#42597a">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
    Conversion en cours…  puis  ✅  ZIP créé : dicom_export_….zip
  </text>

  <text x="360" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9fb0c6" font-style="italic">
    Aperçu — remplacez assets/demo-placeholder.svg par votre vrai assets/demo.gif
  </text>
</svg>
