[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-to-images"
version = "1.0.0"
description = "Outil local de conversion de dossiers DICOM (CD scanner) en PNG/JPEG avec export ZIP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydicom",
    "numpy",
    "Pillow",
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "pylibjpeg-openjpeg",
    "pylibjpeg-rle",
]

[project.optional-dependencies]
test = ["pytest"]
gui3d = [
    "SimpleITK",
    "vtk",
    "PySide6",
    "scipy",
    "scikit-image",
    "matplotlib",
]

[project.scripts]
dicom-to-images = "dicom_to_images:main"
dicom-3d = "app_3d:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
# Points d'entrée (scripts lançant une application) restés à la racine.
py-modules = [
    "dicom_to_images",
    "dicom_to_images_gui",
    "dicom_drop",
    "app_3d",
    "vtk_view",
]

[tool.setuptools.packages.find]
include = ["dicomkit*"]

