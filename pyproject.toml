[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-to-images"
version = "1.0.0"
description = "Outil local de conversion de dossiers DICOM (CD scanner) en PNG/JPEG avec export ZIP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydicom",
    "numpy",
    "Pillow",
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "pylibjpeg-openjpeg",
    "pylibjpeg-rle",
]

[project.optional-dependencies]
test = ["pytest"]
gui3d = [
    "SimpleITK",
    "vtk",
    "PySide6",
    "scipy",
    "scikit-image",
    "matplotlib",
]

[project.scripts]
dicom-to-images = "dicom_to_images:main"
dicom-3d = "app_3d:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = [
    "dicom_to_images",
    "dicom_to_images_gui",
    "dicom_drop",
    "dicom_core",
    "dicom_series",
    "image_export",
    "metadata_export",
    "anonymization",
    "utils",
    "volume_builder",
    "vtk_volume",
    "multiplanar_viewer",
    "segmentation",
    "segmentation_manager",
    "mesh_export",
    "viewer_state",
    "workers",
    "main_window",
    "app_3d",
]

